<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280">
  <defs>
    <style>
      .title { font: 18px sans-serif; fill: #1f2937; }
      .axis { stroke: #374151; stroke-width: 1.3; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
      .label { font: 13px sans-serif; fill: #374151; }
      .line { fill: none; stroke: #2563eb; stroke-width: 3; }
      .point { fill: #2563eb; stroke: #1d4ed8; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="480" height="280" fill="#f8fafc"/>
  <text x="150" y="28" class="title">Elbow plot</text>
  <g transform="translate(50,40)">
    <line x1="0" y1="180" x2="360" y2="180" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="180" class="axis"/>
    <line x1="0" y1="120" x2="360" y2="120" class="grid"/>
    <line x1="60" y1="0" x2="60" y2="180" class="grid"/>
    <line x1="120" y1="0" x2="120" y2="180" class="grid"/>
    <line x1="180" y1="0" x2="180" y2="180" class="grid"/>
    <line x1="240" y1="0" x2="240" y2="180" class="grid"/>
    <line x1="300" y1="0" x2="300" y2="180" class="grid"/>
    <path d="M 0 170 L 60 150 L 120 120 L 180 96 L 240 70 L 300 45 L 360 30" class="line"/>
    <circle cx="0" cy="170" r="5" class="point"/>
    <circle cx="60" cy="150" r="5" class="point"/>
    <circle cx="120" cy="120" r="5" class="point"/>
    <circle cx="180" cy="96" r="5" class="point"/>
    <circle cx="240" cy="70" r="5" class="point"/>
    <circle cx="300" cy="45" r="5" class="point"/>
    <circle cx="360" cy="30" r="5" class="point"/>
    <text x="160" y="212" class="label">Number of clusters (K)</text>
    <text x="-25" y="90" transform="rotate(-90 -25 90)" class="label">WSS</text>
    <text x="130" y="95" class="label">elbow</text>
  </g>
</svg>
