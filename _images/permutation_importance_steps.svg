<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230">
  <defs>
    <style>
      .title { font: 18px sans-serif; fill: #1f2937; }
      .step-title { font: 13px sans-serif; font-weight: bold; fill: #1f2937; }
      .label { font: 11px sans-serif; fill: #374151; }
      .box { fill: white; stroke: #d1d5db; stroke-width: 1; }
      .cell { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1; }
      .shuffled { fill: #f59e0b; stroke: #92400e; stroke-width: 1; }
      .arrow { stroke: #4b5563; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="760" height="230" fill="#f8fafc"/>
  <text x="30" y="28" class="title">How permutation importance is measured</text>

  <!-- Step 1 -->
  <rect x="25" y="50" width="155" height="140" rx="6" class="box"/>
  <text x="40" y="72" class="step-title">1. Baseline</text>
  <text x="40" y="88" class="label">Measure accuracy with</text>
  <text x="40" y="101" class="label">the real data</text>
  <g transform="translate(40,115)">
    <rect x="0" y="0" width="30" height="14" class="cell"/>
    <rect x="34" y="0" width="30" height="14" class="cell"/>
    <rect x="68" y="0" width="30" height="14" class="cell"/>
    <rect x="0" y="18" width="30" height="14" class="cell"/>
    <rect x="34" y="18" width="30" height="14" class="cell"/>
    <rect x="68" y="18" width="30" height="14" class="cell"/>
  </g>
  <text x="40" y="170" class="label">Accuracy = 0.84</text>

  <path d="M185,120 L220,120" class="arrow"/>

  <!-- Step 2 -->
  <rect x="225" y="50" width="155" height="140" rx="6" class="box"/>
  <text x="240" y="72" class="step-title">2. Shuffle one column</text>
  <text x="240" y="88" class="label">Scramble a single feature</text>
  <text x="240" y="101" class="label">so it carries no real signal</text>
  <g transform="translate(240,115)">
    <rect x="0" y="0" width="30" height="14" class="shuffled"/>
    <rect x="34" y="0" width="30" height="14" class="cell"/>
    <rect x="68" y="0" width="30" height="14" class="cell"/>
    <rect x="0" y="18" width="30" height="14" class="shuffled"/>
    <rect x="34" y="18" width="30" height="14" class="cell"/>
    <rect x="68" y="18" width="30" height="14" class="cell"/>
  </g>
  <text x="240" y="170" class="label">Feature A is now scrambled</text>

  <path d="M385,120 L420,120" class="arrow"/>

  <!-- Step 3 -->
  <rect x="425" y="50" width="155" height="140" rx="6" class="box"/>
  <text x="440" y="72" class="step-title">3. Re-check accuracy</text>
  <text x="440" y="88" class="label">Run the same model again</text>
  <text x="440" y="101" class="label">on the scrambled data</text>
  <text x="440" y="150" class="label">New accuracy = 0.71</text>

  <path d="M585,120 L620,120" class="arrow"/>

  <!-- Step 4 -->
  <rect x="625" y="50" width="120" height="140" rx="6" class="box"/>
  <text x="638" y="72" class="step-title">4. Importance</text>
  <text x="638" y="90" class="label">0.84 − 0.71</text>
  <text x="638" y="106" class="label">= 0.13 drop</text>
  <text x="638" y="130" class="label">A bigger drop</text>
  <text x="638" y="144" class="label">means the feature</text>
  <text x="638" y="158" class="label">mattered more.</text>
</svg>
