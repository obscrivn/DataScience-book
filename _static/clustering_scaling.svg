<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260">
  <defs>
    <style>
      .title { font: 18px sans-serif; fill: #1f2937; }
      .label { font: 14px sans-serif; fill: #374151; }
      .point { fill: #2563eb; stroke: #1d4ed8; stroke-width: 1.5; }
      .point2 { fill: #f59e0b; stroke: #b45309; stroke-width: 1.5; }
      .axis { stroke: #374151; stroke-width: 1.2; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
    </style>
  </defs>
  <rect width="700" height="260" fill="#f8fafc"/>
  <text x="90" y="28" class="title">Before scaling</text>
  <text x="440" y="28" class="title">After scaling</text>

  <g transform="translate(40,40)">
    <line x1="0" y1="160" x2="240" y2="160" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="160" class="axis"/>
    <line x1="40" y1="0" x2="40" y2="160" class="grid"/>
    <line x1="80" y1="0" x2="80" y2="160" class="grid"/>
    <line x1="120" y1="0" x2="120" y2="160" class="grid"/>
    <line x1="160" y1="0" x2="160" y2="160" class="grid"/>
    <line x1="200" y1="0" x2="200" y2="160" class="grid"/>
    <line x1="0" y1="40" x2="240" y2="40" class="grid"/>
    <line x1="0" y1="80" x2="240" y2="80" class="grid"/>
    <line x1="0" y1="120" x2="240" y2="120" class="grid"/>
    <circle cx="30" cy="120" r="5" class="point"/>
    <circle cx="60" cy="100" r="5" class="point"/>
    <circle cx="90" cy="80" r="5" class="point"/>
    <circle cx="120" cy="130" r="5" class="point"/>
    <circle cx="168" cy="42" r="5" class="point2"/>
    <circle cx="180" cy="55" r="5" class="point2"/>
    <circle cx="200" cy="48" r="5" class="point2"/>
    <circle cx="215" cy="35" r="5" class="point2"/>
    <text x="10" y="190" class="label">small feature</text>
    <text x="120" y="190" class="label">large feature</text>
  </g>

  <g transform="translate(390,40)">
    <line x1="0" y1="160" x2="240" y2="160" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="160" class="axis"/>
    <line x1="40" y1="0" x2="40" y2="160" class="grid"/>
    <line x1="80" y1="0" x2="80" y2="160" class="grid"/>
    <line x1="120" y1="0" x2="120" y2="160" class="grid"/>
    <line x1="160" y1="0" x2="160" y2="160" class="grid"/>
    <line x1="200" y1="0" x2="200" y2="160" class="grid"/>
    <line x1="0" y1="40" x2="240" y2="40" class="grid"/>
    <line x1="0" y1="80" x2="240" y2="80" class="grid"/>
    <line x1="0" y1="120" x2="240" y2="120" class="grid"/>
    <circle cx="55" cy="130" r="5" class="point"/>
    <circle cx="80" cy="98" r="5" class="point"/>
    <circle cx="112" cy="92" r="5" class="point"/>
    <circle cx="132" cy="120" r="5" class="point"/>
    <circle cx="152" cy="50" r="5" class="point2"/>
    <circle cx="176" cy="58" r="5" class="point2"/>
    <circle cx="182" cy="42" r="5" class="point2"/>
    <circle cx="196" cy="35" r="5" class="point2"/>
    <text x="10" y="190" class="label">standardized scale</text>
  </g>
</svg>
