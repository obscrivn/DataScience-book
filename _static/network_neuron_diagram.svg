<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320">
  <defs>
    <style>
      .title { font: 18px sans-serif; fill: #1f2937; }
      .panel-title { font: 14px sans-serif; font-weight: bold; fill: #1f2937; }
      .label { font: 12px sans-serif; fill: #374151; }
      .small { font: 11px sans-serif; fill: #4b5563; }
      .node-in { fill: #a8b8d8; stroke: #4b5563; stroke-width: 1; }
      .node-hidden { fill: #93c5fd; stroke: #1d4ed8; stroke-width: 1; }
      .node-out { fill: #f59e0b; stroke: #92400e; stroke-width: 1.5; }
      .edge { stroke: #9ca3af; stroke-width: 1; }
      .panel-box { fill: white; stroke: #d1d5db; stroke-width: 1; }
      .formula { font: 12px monospace; fill: #1f2937; }
      .arrow { stroke: #4b5563; stroke-width: 2; marker-end: url(#arrowhead2); fill: none; }
      .actbox { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1; }
    </style>
    <marker id="arrowhead2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="820" height="320" fill="#f8fafc"/>
  <text x="30" y="28" class="title">How one neuron turns inputs into a prediction</text>

  <!-- Left panel: small network -->
  <rect x="30" y="45" width="330" height="255" rx="6" class="panel-box"/>
  <text x="50" y="68" class="panel-title">A small feedforward network</text>

  <!-- input layer -->
  <circle cx="90" cy="120" r="14" class="node-in"/>
  <circle cx="90" cy="170" r="14" class="node-in"/>
  <circle cx="90" cy="220" r="14" class="node-in"/>
  <text x="65" y="255" class="small">Input layer</text>

  <!-- hidden layer -->
  <circle cx="200" cy="100" r="14" class="node-hidden"/>
  <circle cx="200" cy="150" r="14" class="node-hidden"/>
  <circle cx="200" cy="200" r="14" class="node-hidden"/>
  <circle cx="200" cy="250" r="14" class="node-hidden"/>
  <text x="170" y="280" class="small">Hidden layer</text>

  <!-- output layer -->
  <circle cx="310" cy="170" r="16" class="node-out"/>
  <text x="280" y="200" class="small">Output</text>

  <!-- edges input -> hidden -->
  <g class="edge">
    <line x1="104" y1="120" x2="186" y2="100"/>
    <line x1="104" y1="120" x2="186" y2="150"/>
    <line x1="104" y1="120" x2="186" y2="200"/>
    <line x1="104" y1="120" x2="186" y2="250"/>
    <line x1="104" y1="170" x2="186" y2="100"/>
    <line x1="104" y1="170" x2="186" y2="150"/>
    <line x1="104" y1="170" x2="186" y2="200"/>
    <line x1="104" y1="170" x2="186" y2="250"/>
    <line x1="104" y1="220" x2="186" y2="100"/>
    <line x1="104" y1="220" x2="186" y2="150"/>
    <line x1="104" y1="220" x2="186" y2="200"/>
    <line x1="104" y1="220" x2="186" y2="250"/>
  </g>
  <!-- edges hidden -> output -->
  <g class="edge">
    <line x1="214" y1="100" x2="296" y2="170"/>
    <line x1="214" y1="150" x2="296" y2="170"/>
    <line x1="214" y1="200" x2="296" y2="170"/>
    <line x1="214" y1="250" x2="296" y2="170"/>
  </g>

  <!-- Right panel: single neuron zoom -->
  <rect x="400" y="45" width="390" height="255" rx="6" class="panel-box"/>
  <text x="420" y="68" class="panel-title">Zoomed in: one hidden neuron</text>
  <text x="420" y="86" class="small">x1 = 1.0, x2 = 2.0, with weights w1 = 0.5, w2 = -0.3, bias b = 0.1</text>

  <circle cx="440" cy="130" r="10" class="node-in"/>
  <text x="455" y="134" class="label">x1 = 1.0</text>
  <circle cx="440" cy="180" r="10" class="node-in"/>
  <text x="455" y="184" class="label">x2 = 2.0</text>

  <line x1="450" y1="130" x2="560" y2="160" class="edge"/>
  <text x="495" y="134" class="small">w1 = 0.5</text>
  <line x1="450" y1="180" x2="560" y2="160" class="edge"/>
  <text x="495" y="200" class="small">w2 = -0.3</text>

  <rect x="560" y="140" width="80" height="40" rx="6" class="actbox"/>
  <text x="572" y="155" class="small">sum + bias</text>
  <text x="572" y="170" class="formula">z = 0.1</text>

  <path d="M640,160 L670,160" class="arrow"/>

  <rect x="675" y="135" width="95" height="50" rx="6" class="actbox"/>
  <text x="685" y="152" class="small">activation</text>
  <text x="685" y="166" class="small">(e.g., ReLU)</text>
  <text x="685" y="180" class="formula">h = 0.1</text>

  <text x="420" y="225" class="small">z = (w1 × x1) + (w2 × x2) + b = (0.5 × 1.0) + (-0.3 × 2.0) + 0.1 = 0.1</text>
  <text x="420" y="245" class="small">The activation function turns z into this neuron's output, h.</text>
  <text x="420" y="265" class="small">Every hidden neuron repeats this same pattern with its own weights and bias.</text>
</svg>
