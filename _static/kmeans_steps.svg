<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220">
  <defs>
    <style>
      .title { font: 18px sans-serif; fill: #1f2937; }
      .label { font: 13px sans-serif; fill: #374151; }
      .point { fill: #a8b8d8; stroke: #4b5563; stroke-width: 1.3; }
      .cluster1 { fill: #3b82f6; }
      .cluster2 { fill: #f59e0b; }
      .cluster3 { fill: #10b981; }
      .center { fill: white; stroke: #111827; stroke-width: 2; }
      .axis { stroke: #374151; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="760" height="220" fill="#f8fafc"/>
  <text x="32" y="30" class="title">K-means: assignment + recompute</text>

  <g transform="translate(30,40)">
    <line x1="0" y1="140" x2="200" y2="140" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="140" class="axis"/>
    <circle cx="35" cy="105" r="6" class="point cluster1"/>
    <circle cx="52" cy="85" r="6" class="point cluster1"/>
    <circle cx="100" cy="95" r="6" class="point cluster2"/>
    <circle cx="135" cy="70" r="6" class="point cluster2"/>
    <circle cx="165" cy="67" r="6" class="point cluster3"/>
    <circle cx="155" cy="113" r="6" class="point cluster3"/>
    <circle cx="50" cy="42" r="8" class="center"/>
    <circle cx="120" cy="38" r="8" class="center"/>
    <circle cx="165" cy="120" r="8" class="center"/>
    <text x="25" y="175" class="label">Step 1: assign</text>
  </g>

  <g transform="translate(290,40)">
    <line x1="0" y1="140" x2="200" y2="140" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="140" class="axis"/>
    <circle cx="35" cy="105" r="6" class="point cluster1"/>
    <circle cx="52" cy="85" r="6" class="point cluster1"/>
    <circle cx="100" cy="95" r="6" class="point cluster2"/>
    <circle cx="135" cy="70" r="6" class="point cluster2"/>
    <circle cx="165" cy="67" r="6" class="point cluster3"/>
    <circle cx="155" cy="113" r="6" class="point cluster3"/>
    <circle cx="46" cy="88" r="8" class="center"/>
    <circle cx="128" cy="82" r="8" class="center"/>
    <circle cx="160" cy="88" r="8" class="center"/>
    <text x="30" y="175" class="label">Step 2: recompute centers</text>
  </g>

  <g transform="translate(550,40)">
    <line x1="0" y1="140" x2="200" y2="140" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="140" class="axis"/>
    <circle cx="35" cy="105" r="6" class="point cluster1"/>
    <circle cx="52" cy="85" r="6" class="point cluster1"/>
    <circle cx="100" cy="95" r="6" class="point cluster2"/>
    <circle cx="135" cy="70" r="6" class="point cluster2"/>
    <circle cx="165" cy="67" r="6" class="point cluster3"/>
    <circle cx="155" cy="113" r="6" class="point cluster3"/>
    <circle cx="47" cy="95" r="8" class="center"/>
    <circle cx="118" cy="82" r="8" class="center"/>
    <circle cx="160" cy="90" r="8" class="center"/>
    <text x="25" y="175" class="label">Step 3: repeat until stable</text>
  </g>
</svg>
